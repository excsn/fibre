[package]
name = "fibre_http"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
authors = ["Excerion Sun <dev@excsn.com>"]

description = "HTTP client whose handles switch between blocking and async with to_sync and to_async, sharing one connection pool."
repository = "https://github.com/excsn/fibre"
readme = "README.md"
keywords = ["http", "client", "async", "sync", "http2"]
categories = ["network-programming", "web-programming::http-client", "asynchronous"]

include = [
  "/src/**/*.rs",
  "/Cargo.toml",
  "/LICENSE",
  "/README.md",
  "/README.USAGE.md",
  "/API_REFERENCE.md",
]

[features]
default = ["http1", "http2", "rustls", "webpki-roots"]
http1 = ["dep:ureq-proto"]
http2 = ["dep:h2"]
rustls = ["dep:rustls"]
native-tls = []
webpki-roots = ["dep:webpki-roots", "rustls"]
native-roots = []
hickory = []
json = ["dep:serde", "dep:serde_json"]
gzip = ["dep:flate2"]
zstd = ["dep:ruzstd"]
cookies = ["dep:cookie_store", "dep:url"]

[dependencies]
bytes = "1.12.1"
fibre = { version = "0.6.9", path = "../channels" }
http = "1.5.0"
libc = "0.2.191"
parking_lot = "0.13.0"
tokio = { version = "1.54.1", default-features = false, features = ["net", "rt", "time"] }

cookie_store = { version = "0.22.1", default-features = false, optional = true }
flate2 = { version = "1.1.11", optional = true }
futures-core = "0.3.34"
h2 = { version = "0.4.20", optional = true }
ruzstd = { version = "0.9.1", optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1.0.229", optional = true }
serde_json = { version = "1.0.154", optional = true }
ureq-proto = { version = "0.7.1", default-features = false, features = ["client"], optional = true }
url = { version = "2.5.8", optional = true }
webpki-roots = { version = "1.0.11", optional = true }

[dev-dependencies]
futures-util = "0.3.34"
flate2 = "1.1.11"
ruzstd = "0.9.1"
h2 = "0.4.20"
rcgen = "0.14.10"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "rt-multi-thread", "time", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
